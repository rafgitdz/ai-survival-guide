# examples/design-output/refunds.yaml
# Reference output of use case 1 (DESIGN), generated by the `openapi-designer`
# skill from tickets/API-1247.md during a rehearsal.
#
# Choices agreed with the human during that run:
#   - Field names aligned with the database schema (amountCents / currencyIso)
#     rather than the ticket's business names (amount / currency).
#     Rationale: consistency with db/schema.sql (payments.amount_cents,
#     payments.currency_iso) and with the proposed `refunds` table
#     (schema-refunds.sql). To revisit if a mapping layer is introduced in
#     the service.
#   - A dedicated spec (refunds.yaml) rather than an extension of
#     payments.yaml: payments.yaml is deliberately flawed (demo fixture), so
#     the new contract does not inherit its planted defects.
openapi: 3.1.0
info:
  title: Refunds API
  version: "1.0.0"
  description: |
    Dedicated endpoint for refunds of captured payments.
    Separates the refund flow from the payment flow to ease audit and
    accounting reconciliation (ticket API-1247).

servers:
  - url: https://api.franceapi.example.com

security:
  - bearerAuth: []

tags:
  - name: refunds
    description: Operations on payment refunds.

paths:
  /v1/refunds:
    post:
      tags: [refunds]
      summary: Create a refund for an existing captured payment.
      description: |
        Creates a full (when `amountCents` is omitted) or partial refund of a
        payment in `CAPTURED` status. The cumulative sum of refunds cannot
        exceed the amount of the source payment.
      operationId: createRefund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundCreateRequest'
      responses:
        "201":
          description: Refund created.
          headers:
            X-RateLimit-Limit:     { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            X-RateLimit-Reset:     { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/PaymentNotFound'
        "409":
          $ref: '#/components/responses/RefundConflict'
        "422":
          $ref: '#/components/responses/Unprocessable'
        "500":
          $ref: '#/components/responses/Internal'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    RateLimitLimit:
      description: Quota of requests permitted in the current window.
      schema: { type: integer }
    RateLimitRemaining:
      description: Remaining requests in the current window.
      schema: { type: integer }
    RateLimitReset:
      description: Unix epoch (seconds) when the rate-limit window resets.
      schema: { type: integer }

  responses:
    BadRequest:
      description: Malformed request (invalid JSON, missing required field).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.franceapi.example.com/errors/bad-request"
            title: "Bad Request"
            status: 400
            detail: "Field 'paymentId' is required."
            instance: "/v1/refunds"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.franceapi.example.com/errors/unauthorized"
            title: "Unauthorized"
            status: 401
            detail: "Missing or invalid bearer token."
            instance: "/v1/refunds"
    Forbidden:
      description: Authenticated principal is not allowed to refund this payment.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.franceapi.example.com/errors/forbidden"
            title: "Forbidden"
            status: 403
            detail: "Principal is not allowed to refund payment 8f1c0b62-9e15-4b8a-9c3a-2e7b8f7c0001."
            instance: "/v1/refunds"
    PaymentNotFound:
      description: Source payment does not exist.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.franceapi.example.com/errors/payment-not-found"
            title: "Payment Not Found"
            status: 404
            detail: "Payment 8f1c0b62-9e15-4b8a-9c3a-2e7b8f7c0001 does not exist."
            instance: "/v1/refunds"
    RefundConflict:
      description: |
        Refund not allowed in the current state. Either the source payment
        is not `CAPTURED`, or the cumulative refunded amount would exceed
        the payment total.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.franceapi.example.com/errors/refund-conflict"
            title: "Refund Conflict"
            status: 409
            detail: "Payment 8f1c0b62-9e15-4b8a-9c3a-2e7b8f7c0001 is in status AUTHORIZED; only CAPTURED payments can be refunded."
            instance: "/v1/refunds"
    Unprocessable:
      description: Business validation failure (e.g. `amountCents` <= 0).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.franceapi.example.com/errors/unprocessable"
            title: "Unprocessable Entity"
            status: 422
            detail: "Field 'amountCents' must be greater than 0."
            instance: "/v1/refunds"
    Internal:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.franceapi.example.com/errors/internal"
            title: "Internal Server Error"
            status: 500
            detail: "Unexpected error."
            instance: "/v1/refunds"

  schemas:
    Problem:
      description: RFC 7807 problem detail object.
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:     { type: string, format: uri, description: "URI identifying the problem type." }
        title:    { type: string, description: "Short human-readable summary of the problem." }
        status:   { type: integer, description: "HTTP status code." }
        detail:   { type: string, description: "Human-readable explanation specific to this occurrence." }
        instance: { type: string, description: "URI reference identifying the specific occurrence." }

    RefundCreateRequest:
      description: |
        Input payload for creating a refund. Excludes server-derived fields
        (`id`, `status`, `createdAt`, `currencyIso`) and the principal
        (derived from the JWT) to prevent mass-assignment (AGENTS.md §6).
      type: object
      additionalProperties: false
      required: [paymentId]
      properties:
        paymentId:
          type: string
          format: uuid
          description: Identifier of the source payment. Must be in status `CAPTURED`.
        amountCents:
          type: integer
          format: int64
          minimum: 1
          description: |
            Amount to refund, in minor units (aligned with
            `payments.amount_cents` in the database schema).
            If omitted, the refund covers the full remaining refundable amount.
        reason:
          type: string
          maxLength: 280
          description: Free-text reason logged for audit and reconciliation.

    Refund:
      description: A refund resource as returned by the API.
      type: object
      additionalProperties: false
      required: [id, paymentId, amountCents, currencyIso, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Server-assigned refund identifier.
        paymentId:
          type: string
          format: uuid
          description: Identifier of the source payment.
        amountCents:
          type: integer
          format: int64
          minimum: 1
          description: Refunded amount in minor units.
        currencyIso:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 currency code, inherited from the source payment.
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED]
          description: Lifecycle status of the refund.
        reason:
          type: string
          maxLength: 280
          description: Free-text reason captured at creation time.
        createdAt:
          type: string
          format: date-time
          description: Server-assigned creation timestamp (RFC 3339 / ISO 8601).
      example:
        id: "9b2d1c73-ae26-4c0b-8c4a-3f8c9d8e0001"
        paymentId: "8f1c0b62-9e15-4b8a-9c3a-2e7b8f7c0001"
        amountCents: 1999
        currencyIso: "EUR"
        status: "PENDING"
        reason: "Customer cancellation."
        createdAt: "2026-06-11T10:15:00Z"
