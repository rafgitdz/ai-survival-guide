# openapi/refunds.yaml
# Spec dédiée à la ressource Refund (ticket API-1247).
# Fichier séparé de payments.yaml — qui est volontairement imparfait (use cases SECURE/AUDIT).
# Cette spec-ci vise la conformité stricte à AGENTS.md.
openapi: 3.1.0
info:
  title: FranceAPI Refunds
  version: "1.0.0"
  description: |
    API de remboursement des paiements FranceAPI.
    Permet de créer un remboursement total ou partiel sur un paiement `CAPTURED`.

servers:
  - url: https://api.franceapi.example.com

security:
  - bearerAuth: []

tags:
  - name: refunds
    description: Opérations de remboursement.

paths:
  /v1/refunds:
    post:
      tags: [refunds]
      summary: Create a refund for a captured payment
      description: |
        Crée un remboursement (total ou partiel) sur un paiement existant.
        Le paiement source doit être en statut `CAPTURED`.
        Si `amount` est omis, le remboursement porte sur le montant total
        restant remboursable. La devise est héritée du paiement source
        et n'est pas accepté en entrée.
      operationId: createRefund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundCreateRequest'
            examples:
              fullRefund:
                summary: Remboursement total (amount omis)
                value:
                  paymentId: "8f1c0b62-9e15-4b8a-9c3a-2e7b8f7c0001"
                  reason: "Client unsatisfied with delivery delay."
              partialRefund:
                summary: Remboursement partiel
                value:
                  paymentId: "8f1c0b62-9e15-4b8a-9c3a-2e7b8f7c0001"
                  amount: 500
                  reason: "Partial refund — damaged item."
      responses:
        "201":
          description: Refund created.
          headers:
            Location:
              description: URI canonique du remboursement créé.
              schema: { type: string, format: uri }
            X-RateLimit-Limit:
              description: Quota d'appels autorisé sur la fenêtre courante.
              schema: { type: integer }
            X-RateLimit-Remaining:
              description: Appels restants sur la fenêtre courante.
              schema: { type: integer }
            X-RateLimit-Reset:
              description: Timestamp unix (s) de réinitialisation du quota.
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
              example:
                id: "b7f0c9d2-3a41-4e8b-9c12-7f3a8e4d2010"
                paymentId: "8f1c0b62-9e15-4b8a-9c3a-2e7b8f7c0001"
                amount: 500
                currency: "EUR"
                status: "PENDING"
                createdAt: "2026-06-03T09:42:11Z"
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/PaymentNotFound'
        "409":
          $ref: '#/components/responses/RefundConflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "500":
          $ref: '#/components/responses/Internal'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT validé côté serveur (signature + exp + iss + aud).

  responses:
    BadRequest:
      description: Requête mal formée (JSON invalide, champ requis manquant, type incorrect).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.franceapi.example.com/errors/bad-request"
            title: "Bad Request"
            status: 400
            detail: "Field 'paymentId' is required."
            instance: "/v1/refunds"
    Unauthorized:
      description: JWT manquant ou invalide.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.franceapi.example.com/errors/unauthorized"
            title: "Unauthorized"
            status: 401
            detail: "Missing or invalid bearer token."
            instance: "/v1/refunds"
    Forbidden:
      description: JWT valide mais l'appelant n'a pas le scope requis pour rembourser.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.franceapi.example.com/errors/forbidden"
            title: "Forbidden"
            status: 403
            detail: "Caller lacks scope 'refunds:write'."
            instance: "/v1/refunds"
    PaymentNotFound:
      description: Le paiement source n'existe pas.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.franceapi.example.com/errors/payment-not-found"
            title: "Payment Not Found"
            status: 404
            detail: "Payment '8f1c0b62-9e15-4b8a-9c3a-2e7b8f7c0001' does not exist."
            instance: "/v1/refunds"
    RefundConflict:
      description: |
        Conflit métier — le paiement n'est pas dans un état remboursable
        ou le cumul des remboursements dépasserait le montant capturé.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            paymentNotCaptured:
              summary: Paiement non CAPTURED
              value:
                type: "https://api.franceapi.example.com/errors/payment-not-refundable"
                title: "Payment Not Refundable"
                status: 409
                detail: "Payment status is 'AUTHORIZED'; only 'CAPTURED' payments can be refunded."
                instance: "/v1/refunds"
            amountExceedsRemaining:
              summary: Cumul de remboursements supérieur au montant
              value:
                type: "https://api.franceapi.example.com/errors/refund-amount-exceeds-remaining"
                title: "Refund Amount Exceeds Remaining"
                status: 409
                detail: "Requested 1500, but only 500 remains refundable on this payment."
                instance: "/v1/refunds"
    UnprocessableEntity:
      description: Validation métier en échec (ex. amount ≤ 0).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.franceapi.example.com/errors/invalid-amount"
            title: "Invalid Amount"
            status: 422
            detail: "Field 'amount' must be strictly positive."
            instance: "/v1/refunds"
    Internal:
      description: Erreur serveur inattendue.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.franceapi.example.com/errors/internal"
            title: "Internal Server Error"
            status: 500
            detail: "Unexpected error."
            instance: "/v1/refunds"

  schemas:
    Problem:
      description: Format d'erreur RFC 7807.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: URI identifiant le type d'erreur.
        title:
          type: string
          description: Résumé court et stable (indépendant de l'instance).
        status:
          type: integer
          description: Code HTTP associé.
        detail:
          type: string
          description: Explication spécifique à cette occurrence.
        instance:
          type: string
          description: URI de la ressource ou de la requête à l'origine de l'erreur.

    RefundCreateRequest:
      description: |
        Payload de création d'un remboursement.
        Seuls les champs modifiables par le client sont acceptés.
        `id`, `status`, `currency`, `createdAt` sont calculés côté serveur
        et NE DOIVENT PAS être envoyés.
      type: object
      additionalProperties: false
      required: [paymentId]
      properties:
        paymentId:
          type: string
          format: uuid
          description: Identifiant du paiement source à rembourser.
        amount:
          type: integer
          minimum: 1
          description: |
            Montant à rembourser en minor units (centimes pour EUR).
            Si omis, remboursement du montant total restant remboursable.
            Doit être strictement positif si fourni.
        reason:
          type: string
          maxLength: 280
          description: Motif libre du remboursement (optionnel).

    Refund:
      description: Représentation d'un remboursement.
      type: object
      additionalProperties: false
      required: [id, paymentId, amount, currency, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant unique du remboursement.
        paymentId:
          type: string
          format: uuid
          description: Identifiant du paiement source.
        amount:
          type: integer
          minimum: 1
          description: Montant remboursé en minor units.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Devise ISO 4217, héritée du paiement source.
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED]
          description: |
            État du remboursement.
            `PENDING` : créé, en cours de traitement par le PSP.
            `SUCCEEDED` : remboursement confirmé.
            `FAILED` : refus du PSP ou échec définitif.
        createdAt:
          type: string
          format: date-time
          description: Horodatage de création (UTC, ISO 8601).
      example:
        id: "b7f0c9d2-3a41-4e8b-9c12-7f3a8e4d2010"
        paymentId: "8f1c0b62-9e15-4b8a-9c3a-2e7b8f7c0001"
        amount: 500
        currency: "EUR"
        status: "PENDING"
        createdAt: "2026-06-03T09:42:11Z"
