# openapi/payments-v2.yaml
# "After" spec for the EVOLVE use case.
# CONTAINS DELIBERATE BREAKING CHANGES, to demonstrate breaking-change-detector:
#   1. `amount` renamed to `value` in Payment                  → MAJOR (rename)
#   2. `currency` goes from free string to a restricted enum   → MAJOR (type/constraint change)
#   3. `createdAt` removed                                     → MAJOR (removal)
#   4. New `status` query param on GET /v1/payments            → MINOR (optional add)
#   5. 404 error format enriched with a `code` field           → PATCH/MINOR (additive)
# The path is still /v1/... although the bump is MAJOR: that is exactly the trap
# the detector must reveal (it must be published under /v2).
openapi: 3.1.0
info:
  title: Payments API
  version: "1.3.0"   # PLANTED: should be 2.0.0 since there are MAJOR changes

security:
  - bearerAuth: []

paths:
  /v1/payments:
    get:
      summary: List payments
      operationId: listPayments
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, AUTHORIZED, CAPTURED, REFUNDED, FAILED] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/payments/{paymentId}:
    get:
      summary: Get a payment
      operationId: getPayment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:    { type: string, format: uri }
        title:   { type: string }
        status:  { type: integer }
        detail:  { type: string }
        code:    { type: string, description: "Stable machine-readable error code (additive)." }

    Payment:
      type: object
      required: [id, value, currency, status]
      properties:
        id:       { type: string, format: uuid }
        value:    { type: integer, description: "Renamed from amount. Minor units." }
        currency: { type: string, enum: [EUR, USD, GBP] }
        status:   { type: string, enum: [PENDING, AUTHORIZED, CAPTURED, REFUNDED, FAILED] }
