# openapi/payments-v2.yaml
# Spec v2 — publiée sous /v2 suite à 4 breaking changes (MAJOR, AGENTS.md §3).
# Breaking changes par rapport à payments-v1.yaml :
#   1. `amount` renommé en `value` dans Payment           → MAJOR (rename)
#   2. `currency` passe de string libre à enum restreint   → MAJOR (type/constraint change)
#   3. `createdAt` supprimé                                → MAJOR (removal)
# Additifs (MINOR, non-breaking) :
#   4. Nouveau query param `status` sur GET /v2/payments   → MINOR (optional add)
#   5. Champ `code` ajouté à Problem                       → MINOR (additive)
openapi: 3.1.0
info:
  title: FranceAPI Payments
  version: "2.0.0"

security:
  - bearerAuth: []

paths:
  /v2/payments:
    get:
      summary: List payments
      operationId: listPayments
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, AUTHORIZED, CAPTURED, REFUNDED, FAILED] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v2/payments/{paymentId}:
    get:
      summary: Get a payment
      operationId: getPayment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:    { type: string, format: uri }
        title:   { type: string }
        status:  { type: integer }
        detail:  { type: string }
        code:    { type: string, description: "Stable machine-readable error code (additive)." }

    Payment:
      type: object
      required: [id, value, currency, status]
      properties:
        id:       { type: string, format: uuid }
        value:    { type: integer, description: "Renamed from amount. Minor units." }
        currency: { type: string, enum: [EUR, USD, GBP] }
        status:   { type: string, enum: [PENDING, AUTHORIZED, CAPTURED, REFUNDED, FAILED] }
