# openapi/payments-v2.yaml
# Payments API v2 (major version), published alongside the deprecated v1.
# See CHANGELOG.md [2.0.0] and docs/adr/0007-publish-payments-v2-alongside-deprecated-v1.md.
openapi: 3.1.0
info:
  title: Payments API
  version: "2.0.0"
  description: |
    Payments API, major version 2. Served under `/v2`, alongside `/v1`
    (deprecated, sunset on 2027-05-31).

    Observability: every route is measured by Micrometer
    (`http_server_requests_seconds`), exposed on `/actuator/prometheus`.
    Rate limiting: every successful response carries `X-RateLimit-Limit` and
    `X-RateLimit-Remaining`; an exhausted quota returns `429`.

security:
  - bearerAuth: []

tags:
  - name: payments
    description: Read access to payments.

paths:
  /v2/payments:
    get:
      summary: List payments
      description: Lists payments, optionally filtered by status, newest first.
      operationId: listPayments
      tags: [payments]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, AUTHORIZED, CAPTURED, REFUNDED, FAILED] }
      responses:
        "200":
          description: OK
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
              example:
                - id: "3f6c2a9e-8b1d-4c7a-9e2f-5d4b1a0c7e88"
                  value: 4999
                  currency: EUR
                  status: CAPTURED
                  createdAt: "2026-11-30T09:15:42Z"
                - id: "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
                  value: 12000
                  currency: GBP
                  status: PENDING
                  createdAt: "2026-11-30T08:02:10Z"
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "429": { $ref: '#/components/responses/TooManyRequests' }
        "500": { $ref: '#/components/responses/InternalError' }

  /v2/payments/{paymentId}:
    get:
      summary: Get a payment
      description: Returns a single payment by its identifier.
      operationId: getPayment
      tags: [payments]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
              example:
                id: "3f6c2a9e-8b1d-4c7a-9e2f-5d4b1a0c7e88"
                value: 4999
                currency: EUR
                status: CAPTURED
                createdAt: "2026-11-30T09:15:42Z"
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/TooManyRequests' }
        "500": { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  headers:
    XRateLimitLimit:
      description: Maximum number of requests allowed in the current window.
      schema: { type: integer, example: 1000 }
    XRateLimitRemaining:
      description: Number of requests left in the current window.
      schema: { type: integer, example: 998 }

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.example.com/problems/invalid-parameter"
            title: Invalid parameter
            status: 400
            detail: "Query parameter 'status' must be one of PENDING, AUTHORIZED, CAPTURED, REFUNDED, FAILED."
            code: INVALID_PARAMETER
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.example.com/problems/unauthorized"
            title: Unauthorized
            status: 401
            detail: The bearer token is missing, expired or has an invalid signature.
            code: TOKEN_INVALID
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.example.com/problems/forbidden"
            title: Forbidden
            status: 403
            detail: The token does not grant the 'payments:read' scope.
            code: SCOPE_MISSING
    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.example.com/problems/not-found"
            title: Payment not found
            status: 404
            detail: No payment with id 3f6c2a9e-8b1d-4c7a-9e2f-5d4b1a0c7e88 is visible to this client.
            code: PAYMENT_NOT_FOUND
    TooManyRequests:
      description: Too Many Requests
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.example.com/problems/rate-limited"
            title: Too many requests
            status: 429
            detail: Rate limit of 1000 requests per minute exceeded. Retry after 12 seconds.
            code: RATE_LIMITED
    InternalError:
      description: Internal Server Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.example.com/problems/internal-error"
            title: Internal server error
            status: 500
            detail: An unexpected error occurred. The incident has been logged.
            code: INTERNAL_ERROR

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:    { type: string, format: uri }
        title:   { type: string }
        status:  { type: integer }
        detail:  { type: string }
        code:    { type: string, description: "Stable machine-readable error code." }

    Payment:
      type: object
      required: [id, value, currency, status, createdAt]
      properties:
        id:        { type: string, format: uuid }
        value:     { type: integer, description: "Amount in minor units (renamed from v1 `amount`)." }
        currency:  { type: string, enum: [EUR, USD, GBP] }
        status:    { type: string, enum: [PENDING, AUTHORIZED, CAPTURED, REFUNDED, FAILED] }
        createdAt: { type: string, format: date-time }
