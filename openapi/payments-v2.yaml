# openapi/payments-v2.yaml
# Contrat v2 officiel de FranceAPI Payments.
#
# v2 introduit des breaking changes vis-à-vis de v1 (cf. CHANGELOG.md, entrée [2.0.0]).
# Synthèse pédagogique des changements pour les intégrateurs :
#   1. Payment.amount est renommé en Payment.value (réponse).
#   2. Payment.currency est restreint à l'enum [EUR, USD, GBP] (réponse).
#   3. Payment.createdAt est supprimé (réponse) et retiré de required[].
#   4. Les ressources sont désormais servies sous /v2/payments (au lieu de /v1/payments).
#   5. Ajouts additifs : query param optionnel `status` sur GET /v2/payments,
#      champ optionnel `code` sur Problem.
#
# v1 reste exposée en parallèle, mais marquée deprecated (Sunset : 2026-12-08).
openapi: 3.1.0
info:
  title: FranceAPI Payments
  version: "2.0.0"
  description: |
    Version 2 du contrat Payments.

    Cette version introduit des breaking changes par rapport à v1 (rename de champ,
    restriction d'enum, suppression de `createdAt`, nouveau préfixe `/v2`).
    Consulter CHANGELOG.md (entrée [2.0.0]) pour la liste exhaustive et le guide
    de migration. La v1 reste disponible jusqu'à la date de Sunset (2026-12-08).

servers:
  - url: https://api.franceapi.example.com

security:
  - bearerAuth: []

paths:
  /v2/payments:
    get:
      summary: List payments
      operationId: listPayments
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, AUTHORIZED, CAPTURED, REFUNDED, FAILED] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v2/payments/{paymentId}:
    get:
      summary: Get a payment
      operationId: getPayment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:    { type: string, format: uri }
        title:   { type: string }
        status:  { type: integer }
        detail:  { type: string }
        code:    { type: string, description: "Stable machine-readable error code (additive)." }

    Payment:
      type: object
      required: [id, value, currency, status]
      properties:
        id:       { type: string, format: uuid }
        value:    { type: integer, description: "Renamed from amount. Minor units." }
        currency: { type: string, enum: [EUR, USD, GBP] }
        status:   { type: string, enum: [PENDING, AUTHORIZED, CAPTURED, REFUNDED, FAILED] }
