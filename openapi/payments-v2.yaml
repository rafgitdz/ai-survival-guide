# openapi/payments-v2.yaml
# Spec v2 publiée sous /v2 — bump MAJOR (Semver) suite au rapport breaking-change-detector :
#   1. `amount` renommé en `value` dans Payment                → MAJOR (rename)
#   2. `currency` passe de string libre à un enum restreint    → MAJOR (type/constraint change)
#   3. `createdAt` supprimé                                    → MAJOR (removal)
#   4. Nouveau query param `status` sur GET /v2/payments       → MINOR (optional add)
#   5. Champ `code` ajouté à Problem                           → MINOR (additive optional response field)
# Cf. CHANGELOG.md [2.0.0] et /v1 deprecated avec sunset.
openapi: 3.1.0
info:
  title: FranceAPI Payments
  version: "2.0.0"

security:
  - bearerAuth: []

paths:
  /v2/payments:
    get:
      summary: List payments
      operationId: listPayments
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, AUTHORIZED, CAPTURED, REFUNDED, FAILED] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/Internal' }

  /v2/payments/{paymentId}:
    get:
      summary: Get a payment
      operationId: getPayment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/Internal' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  responses:
    BadRequest:
      description: Malformed request (invalid path parameter, bad query value, etc.).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.franceapi.example.com/errors/bad-request"
            title: "Bad Request"
            status: 400
            detail: "Path parameter 'paymentId' must be a valid UUID."
            instance: "/v2/payments/not-a-uuid"
            code: "BAD_REQUEST"

    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.franceapi.example.com/errors/unauthorized"
            title: "Unauthorized"
            status: 401
            detail: "Missing or invalid bearer token."
            instance: "/v2/payments"
            code: "UNAUTHORIZED"

    Forbidden:
      description: Authenticated caller is not allowed to access this resource.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.franceapi.example.com/errors/forbidden"
            title: "Forbidden"
            status: 403
            detail: "Caller is not authorized to access payment 8f1c0b62-9e15-4b8a-9c3a-2e7b8f7c0001."
            instance: "/v2/payments/8f1c0b62-9e15-4b8a-9c3a-2e7b8f7c0001"
            code: "FORBIDDEN"

    NotFound:
      description: The referenced payment does not exist.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.franceapi.example.com/errors/payment-not-found"
            title: "Payment Not Found"
            status: 404
            detail: "Payment 8f1c0b62-9e15-4b8a-9c3a-2e7b8f7c0001 does not exist."
            instance: "/v2/payments/8f1c0b62-9e15-4b8a-9c3a-2e7b8f7c0001"
            code: "PAYMENT_NOT_FOUND"

    Internal:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.franceapi.example.com/errors/internal"
            title: "Internal Server Error"
            status: 500
            detail: "Unexpected error."
            instance: "/v2/payments"
            code: "INTERNAL"

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:    { type: string, format: uri }
        title:   { type: string }
        status:  { type: integer }
        detail:  { type: string }
        code:    { type: string, description: "Stable machine-readable error code (additive)." }

    Payment:
      type: object
      required: [id, value, currency, status]
      properties:
        id:       { type: string, format: uuid }
        value:    { type: integer, description: "Renamed from amount. Minor units." }
        currency: { type: string, enum: [EUR, USD, GBP] }
        status:   { type: string, enum: [PENDING, AUTHORIZED, CAPTURED, REFUNDED, FAILED] }
