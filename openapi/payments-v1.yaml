# openapi/payments-v1.yaml
# "Before" spec for the EVOLVE use case.
# Compliant with the rules (kebab-case, /v1, RFC 7807, bearerAuth, etc.): the reference version.
openapi: 3.1.0
info:
  title: Payments API
  version: "1.3.0"

security:
  - bearerAuth: []

paths:
  /v1/payments:
    get:
      summary: List payments
      operationId: listPayments
      deprecated: true
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: OK
          headers:
            Deprecation: { $ref: '#/components/headers/Deprecation' }
            Sunset: { $ref: '#/components/headers/Sunset' }
            Link: { $ref: '#/components/headers/SuccessorLink' }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/payments/{paymentId}:
    get:
      summary: Get a payment
      operationId: getPayment
      deprecated: true
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          headers:
            Deprecation: { $ref: '#/components/headers/Deprecation' }
            Sunset: { $ref: '#/components/headers/Sunset' }
            Link: { $ref: '#/components/headers/SuccessorLink' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  headers:
    Deprecation:
      description: "RFC 9745: this API version is deprecated since 2026-11-30T00:00:00Z."
      schema: { type: string, example: "@1795996800" }
    Sunset:
      description: "RFC 8594: this API version stops being served at this date."
      schema: { type: string, example: "Mon, 31 May 2027 00:00:00 GMT" }
    SuccessorLink:
      description: "RFC 8288 link to the successor version of this resource."
      schema: { type: string, example: '</v2/payments>; rel="successor-version"' }

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:    { type: string, format: uri }
        title:   { type: string }
        status:  { type: integer }
        detail:  { type: string }

    Payment:
      type: object
      required: [id, amount, currency, status, createdAt]
      properties:
        id:        { type: string, format: uuid }
        amount:    { type: integer, description: "Minor units" }
        currency:  { type: string, pattern: "^[A-Z]{3}$" }
        status:    { type: string, enum: [PENDING, AUTHORIZED, CAPTURED, REFUNDED, FAILED] }
        createdAt: { type: string, format: date-time }
