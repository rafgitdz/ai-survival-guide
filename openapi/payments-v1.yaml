# openapi/payments-v1.yaml
# Version v1 du contrat Payments — DÉPRÉCIÉE depuis 2026-06-08, Sunset 2026-12-08.
# Successeur officiel : /v2/payments (cf. openapi/payments-v2.yaml et CHANGELOG.md [2.0.0]).
# Aucun changement contractuel ici — uniquement métadonnées de dépréciation (bump PATCH 1.2.0 -> 1.3.0).
openapi: 3.1.0
info:
  title: FranceAPI Payments
  version: "1.3.0"
  description: |
    Deprecated 2026-06-08 — Sunset 2026-12-08.
    Successor: /v2/payments (voir openapi/payments-v2.yaml).
    Aucun nouveau client ne doit intégrer cette version. Les clients existants
    doivent migrer avant la date de Sunset. Les réponses incluent les headers
    `Deprecation` (RFC 9745), `Sunset` (RFC 8594) et `Link` (RFC 8288) pointant
    vers le successeur.

security:
  - bearerAuth: []

paths:
  /v1/payments:
    get:
      summary: List payments
      operationId: listPayments
      deprecated: true
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: OK
          headers:
            Deprecation:
              description: |
                RFC 9745 — date de dépréciation de l'opération, exprimée sous
                forme de Structured Field Date (`@<unix-timestamp>`).
                Valeur : `@1780185600` (2026-06-08T00:00:00Z).
              schema:
                type: string
                example: "@1780185600"
            Sunset:
              description: |
                RFC 8594 — date après laquelle l'opération sera retirée.
              schema:
                type: string
                format: http-date
                example: "Mon, 08 Dec 2026 00:00:00 GMT"
            Link:
              description: |
                RFC 8288 — pointe vers la ressource de la version successeure.
              schema:
                type: string
                example: "</v2/payments>; rel=\"successor-version\""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/payments/{paymentId}:
    get:
      summary: Get a payment
      operationId: getPayment
      deprecated: true
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          headers:
            Deprecation:
              description: |
                RFC 9745 — date de dépréciation de l'opération, exprimée sous
                forme de Structured Field Date (`@<unix-timestamp>`).
                Valeur : `@1780185600` (2026-06-08T00:00:00Z).
              schema:
                type: string
                example: "@1780185600"
            Sunset:
              description: |
                RFC 8594 — date après laquelle l'opération sera retirée.
              schema:
                type: string
                format: http-date
                example: "Mon, 08 Dec 2026 00:00:00 GMT"
            Link:
              description: |
                RFC 8288 — pointe vers la ressource de la version successeure.
              schema:
                type: string
                example: "</v2/payments/{paymentId}>; rel=\"successor-version\""
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:    { type: string, format: uri }
        title:   { type: string }
        status:  { type: integer }
        detail:  { type: string }

    Payment:
      type: object
      required: [id, amount, currency, status, createdAt]
      properties:
        id:        { type: string, format: uuid }
        amount:    { type: integer, description: "Minor units" }
        currency:  { type: string, pattern: "^[A-Z]{3}$" }
        status:    { type: string, enum: [PENDING, AUTHORIZED, CAPTURED, REFUNDED, FAILED] }
        createdAt: { type: string, format: date-time }
